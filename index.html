<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Spatial 3D Portfolio for Paolo Maria Scarlata (ZGr3Y) — Web Security Researcher & Systems Engineer. Featuring real-time optics, transparent glass shaders, and station navigation." />
  <meta name="theme-color" content="#040711" />
  <title>PAOLO MARIA SCARLATA // ZGr3Y — Spatial Portfolio</title>

  <!-- Google Fonts: Syne, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Importmap for standalone static serving fallback -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <link rel="stylesheet" href="./src/styles/main.css" />
  <link rel="stylesheet" href="./src/styles/glass.css" />
  <link rel="stylesheet" href="./src/styles/hud.css" />
  <link rel="stylesheet" href="./src/styles/switcher.css" />
</head>
<body class="loading">
  <!-- 3D Canvas Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Optical Vignette & Chromatic Noise Filter -->
  <div class="viewport-effects pointer-events-none" aria-hidden="true">
    <div class="vignette-overlay"></div>
    <div class="optical-scanlines"></div>
  </div>

  <!-- Persistent 2D/3D HUD Container -->
  <header id="hud" class="hud-container"></header>

  <!-- Station DOM Overlays (HTML Glass Panels synced with current station) -->
  <main id="station-overlay" class="station-overlay-container" aria-live="polite"></main>

  <!-- Modal View for Projects / Technical Details -->
  <aside id="modal-container" class="modal-layer hidden" role="dialog" aria-modal="true" aria-hidden="true"></aside>

  <!-- Prototype Switcher Dock (Bottom) -->
  <nav id="prototype-switcher" class="prototype-switcher" aria-label="Prototype Variant Switcher"></nav>

  <!-- Spatial Navigation Quick Bar (Right Edge) -->
  <nav id="station-dock" class="station-dock" aria-label="Station Quick Navigation"></nav>

  <!-- Screen Reader Announcements -->
  <div id="sr-announcements" class="sr-only" aria-live="assertive"></div>

  <!-- Initial Boot Loader Screen -->
  <div id="boot-loader" class="boot-loader">
    <div class="loader-content">
      <div class="loader-ring"></div>
      <div class="loader-title">INITIALIZING SPATIAL SYSTEM</div>
      <div class="loader-status" id="boot-status">Calibrating refractive optics...</div>
    </div>
  </div>

  <!-- Application Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
